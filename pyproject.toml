[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "SalishSeaNowcast"
dynamic = [ "version" ]
description = "SalishSeaCast ocean modeling automation system"
readme = "README.rst"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
    { name = "Doug Latornell", email = "dlatornell@eoas.ubc.ca" },
]
keywords = [
    "automation", "oceanography", "ocean modelling",
    "UBC-MOAD", "Salish Sea", "SalishSeaCast",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # see envs/environment-prod.yaml for conda environment production installation
    # see envs/environment-dev.yaml for conda environment dev installation
    # see envs/requirements.txt for package versions used during recent development
    # see envs/environment-rtd.yaml for conda environment used for readthedocs build
    "angles>=2.0,<3",
    "arrow",
    "beautifulsoup4",
    "bottleneck",
    "cartopy",
    "cfgrib",
    "click",
    "cliff",
    "cmocean",
    "dask",
    "docutils",
    "erddapy",
    "et-xmlfile",
    "f90nml",
    "feedgen",
    "flox",
    "gitpython",
    "gsw",
    "h5netcdf",
    "httpx",
    "lxml",
    "mako",
    "matplotlib",
    "moad-tools @ git+https://github.com/UBC-MOAD/moad_tools.git",
    "nc-time-axis",
    "nemo-cmd @ git+https://github.com/SalishSeaCast/NEMO-Cmd.git",
    "nemo-nowcast @ git+https://github.com/43ravens/NEMO_Nowcast.git",
    "netcdf4",
    "numpy",
    "numpy-indexed",
    "openpyxl",
    "pandas",
    "paramiko",
    "pillow",
    # "poppler",  # pip doesn't see poppler pkg installed by conda to provide pdftocairo
    "pygrib",
    "pypdf",
    "python-hglib>=2.6.2,<3",
    "pyyaml",
    "reshapr @ git+https://github.com/UBC-MOAD/Reshapr.git",
    "retrying",
    "rich",
    "salishseacmd @ git+https://github.com/SalishSeaCast/SalishSeaCmd.git",
    "salishseatools @ git+https://github.com/SalishSeaCast/tools.git#subdirectory=SalishSeaTools",
    "scipy",
    "scour",
    "sentry-sdk",
    "structlog",
    "supervisor",
    "sysrsync",
    "tenacity",
    "tqdm",
    "watchdog",
    "xarray",
]

[project.urls]
"Documenation" = "https://salishsea-nowcast.readthedocs.io/en/latest/"
"Changelog" = "https://github.com/SalishSeaCast/SalishSeaNowcast/releases"
"Issue Tracker" = "https://github.com/SalishSeaCast/SalishSeaNowcast/issues"
"Source Code" = "https://github.com/SalishSeaCast/SalishSeaNowcast"


[tool.coverage.run]
branch = true
source = ["nowcast", "tests"]
omit = [ ".pixi/*", "src/*" ]

[tool.coverage.report]
show_missing = true


[tool.hatch.build.targets.wheel]
packages = ["nowcast"]

[tool.hatch.version]
path = "nowcast/__about__.py"

[tool.hatch.metadata]
allow-direct-references = true


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64"]

[tool.pixi.pypi-dependencies]
SalishSeaNowcast = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
arrow = ">=1.4.0,<2"
attrs = ">=26.1.0,<27"
beautifulsoup4 = ">=4.15.0,<5"
bottleneck = ">=1.6.0,<2"
cartopy = ">=0.25.0,<0.26"
cfgrib = ">=0.9.15.1,<0.10"
click = ">=8.4.2,<9"
cliff = ">=4.14.0,<5"
cmocean = ">=4.0.3,<5"
coloredlogs = ">=15.0.1,<16"
dask = ">=2026.7.0,<2027"
docutils = ">=0.23,<0.24"
erddapy = ">=3.3.0,<4"
et_xmlfile = ">=2.0.0,<3"
f90nml = ">=1.5,<2"
feedgen = ">=1.0.0,<2"
flox = ">=0.11.2,<0.12"
gitpython = ">=3.1.50,<4"
gsw = ">=3.6.23,<4"
h5netcdf = ">=1.8.1,<2"
httpx = ">=0.28.1,<0.29"
lxml = ">=6.1.1,<7"
mako = ">=1.3.12,<2"
matplotlib = ">=3.11.0,<4"
nc-time-axis = ">=1.4.1,<2"
netcdf4 = ">=1.7.4,<2"
numpy = ">=2.5.1,<3"
numpy-indexed = ">=0.3.7,<0.4"
openpyxl = ">=3.1.5,<4"
pandas = "<3.0.0"
paramiko = ">=5.0.0,<6"
pillow = ">=12.3.0,<13"
poppler = ">=26.7.0,<27"
pygrib = ">=2.1.8,<3"
pypdf = ">=6.14.2,<7"
python = "3.14.*"
pyyaml = ">=6.0.3,<7"
pyzmq = ">=27.1.0,<28"
requests = ">=2.34.2,<3"
retrying = ">=1.4.2,<2"
rich = ">=15.0.0,<16"
schedule = ">=1.2.2,<2"
scipy = ">=1.18.0,<2"
scour = ">=0.38.2,<0.39"
sentry-sdk = ">=2.64.0,<3"
structlog = ">=26.1.0,<27"
supervisor = ">=4.3.0,<5"
sysrsync = ">=1.1.1,<2"
tenacity = ">=9.1.4,<10"
tqdm = ">=4.68.4,<5"
verboselogs = ">=1.7,<2"
watchdog = ">=6.0.0,<7"
xarray = ">=2026.4.0,<2027"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-httpx = ">=0.36.2,<0.37"
pytest-randomly = ">=3.15.0,<4"
tomli = ">=2.4.1,<3"

[tool.pixi.environments]
test = { features = ["test"], solve-group = "default" }
test-py314 = ["py314", "test"]

[tool.pixi.feature.test.tasks]
pytest = "pytest"
pytest-cov = "pytest --cov=./"
pytest-cov-html = "pytest --cov=./ --cov-report html"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"
